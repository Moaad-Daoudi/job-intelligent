name: job-intelligent

services:
  minio:
    image: minio/minio:latest
    container_name: minio_storage
    env_file:
      - ../.env
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ../data/minio:/data

  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data

  airflow-init:
    build:
      context: ..
      dockerfile: services/airflow/Dockerfile
    env_file:
      - ../.env
    container_name: airflow_init
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW_UID: ${AIRFLOW_UID}
    user: "${AIRFLOW_UID}:0"
    command: >
      bash -c "airflow db migrate && airflow users create --username admin --firstname admin --lastname admin --role Admin --email admin@example.com --password admin"

  airflow-db:
    image: postgres:13
    container_name: airflow_db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - ../data/airflow_db:/var/lib/postgresql/data

  airflow-webserver:
    build:
      context: ..
      dockerfile: services/airflow/Dockerfile
    env_file:
      - ../.env
    container_name: airflow_webserver
    depends_on:
      - airflow-db
    ports:
      - "8080:8080"
    volumes:
      - ../services/airflow/dags:/opt/airflow/dags
      - ../services/airflow/logs:/opt/airflow/logs
      - ../services/airflow/plugins:/opt/airflow/plugins
      - ../:/opt/airflow/app
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      PYTHONPATH: /opt/airflow/app
      AIRFLOW_UID: ${AIRFLOW_UID}
      # Use the variables from .env here
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
    command: webserver

  airflow-scheduler:
    build:
      context: ..
      dockerfile: services/airflow/Dockerfile
    env_file:
      - ../.env
    container_name: airflow_scheduler
    depends_on:
      - airflow-db
    volumes:
      - ../services/airflow/dags:/opt/airflow/dags
      - ../services/airflow/logs:/opt/airflow/logs
      - ../services/airflow/plugins:/opt/airflow/plugins
      - ../:/opt/airflow/app
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      PYTHONPATH: /opt/airflow/app
      AIRFLOW_UID: ${AIRFLOW_UID}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
    command: scheduler